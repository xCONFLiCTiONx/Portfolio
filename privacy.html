<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title class="user-name-title-js">Privacy Policy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" id="favicon-js" href="favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .policy-select {
            background: #161b22;
            color: #f0f6fc;
            border: 1px solid #30363d;
            padding: 1rem 1.5rem;
            font-size: 1.6rem;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 3rem;
            cursor: pointer;
        }
        .policy-body {
            min-height: 200px;
        }
        .policy-body h1, .policy-body h2, .policy-body h3 {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 0.5rem;
        }
        .policy-body h4 { margin-top: 2rem; color: #8b949e; }
        .policy-body p { margin-bottom: 1.5rem; }
        .policy-body ul { margin-left: 2rem; margin-bottom: 2.5rem; list-style: disc; }
        .policy-body strong { color: #f0f6fc; }
    </style>
</head>
<body id="top">

    <header class="site-header">
        <nav class="nav-content">
            <div class="nav-brand">
                <a href="index.html">
                    <span id="header-avatar" class="nav-logo"></span>
                    <span class="user-name-js">Loading...</span>
                </a>
            </div>
            <button class="menu-toggle" id="menuToggle">
                <i class="im im-menu"></i>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html"><i class="im im-home"></i> Overview</a></li>
                <li><a href="privacy.html" class="active"><i class="im im-shield"></i> Privacy</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        
        <aside class="sidebar">
            <h1 class="profile-name">Legal</h1>
            <span class="profile-handle">Privacy & Terms</span>
            <p class="profile-bio">
                Detailed information on how my applications handle your data. Transparency is a core value of my development process.
            </p>
        </aside>

        <section class="main-content">
            <h2 class="section-title">Privacy Policy</h2>

            <select id="policySelector" class="policy-select">
                <option value="" disabled selected>-- Loading Policies... --</option>
            </select>

            <div id="policy-content" class="policy-body">
                <!-- Markdown content will be rendered here -->
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container" style="display: block;">
            <p>&copy; 2026 <span class="user-name-js"></span>. All policies are as open as the source code.</p>
        </div>
    </footer>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/github-fetch.js"></script>
    <script src="js/privacy-fetch.js"></script>
    <script>
        // Register Service Worker for PWA (Only on HTTP/HTTPS)
        if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        // Mobile Menu Toggle
        $('#menuToggle').click(function() {
            $('#navLinks').toggleClass('active');
            $(this).find('i').toggleClass('im-menu im-x-mark');
        });
    </script>

</body>
</html>
