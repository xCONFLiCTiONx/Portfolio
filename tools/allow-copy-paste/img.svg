<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#161b22" />
            <stop offset="100%" stop-color="#0d1117" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#58a6ff" />
            <stop offset="100%" stop-color="#1f6beb" />
        </linearGradient>
        <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f78166" />
            <stop offset="100%" stop-color="#ea6045" />
        </linearGradient>
    </defs>

    <!-- Background Card -->
    <rect width="120" height="120" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

    <!-- Decorative Grid / Lines -->
    <circle cx="60" cy="60" r="44" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Camera / Media Symbol -->
    <rect x="30" y="42" width="60" height="42" rx="6" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    <circle cx="60" cy="63" r="12" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    <circle cx="78" cy="50" r="3" fill="#58a6ff" />

    <!-- Lock Badge -->
    <circle cx="85" cy="35" r="14" fill="#161b22" stroke="url(#lockGrad)" stroke-width="2" />
    <path d="M81 35 v-3 a4 4 0 0 1 8 0 v3 m-10 0 h12 v8 h-12 z" fill="none" stroke="url(#lockGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>