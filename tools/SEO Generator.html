<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Pages SEO Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --code-bg: #090d16;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.1rem;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            color: #38bdf8;
            max-height: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Cloudflare Pages SEO Generator</h1>
            <p class="subtitle">Instantly generate a clean robots.txt and sitemap.xml for your static site root.</p>
        </header>

        <div class="card">
            <div class="form-group">
                <label for="domain">Your Website URL</label>
                <input type="text" id="domain" value="https://xconflictionx.cc" placeholder="https://yourdomain.com" oninput="generateFiles()">
            </div>
            <div class="form-group">
                <label for="pages">Pages to Include in Sitemap (comma separated paths)</label>
                <input type="text" id="pages" value="/, /about, /projects" placeholder="/, /contact" oninput="generateFiles()">
            </div>
        </div>

        <div class="card">
            <div class="output-header">
                <h2>robots.txt</h2>
                <button onclick="downloadFile('robots.txt', robotsContent)">Download robots.txt</button>
            </div>
            <pre><code id="robotsOutput"></code></pre>
        </div>

        <div class="card">
            <div class="output-header">
                <h2>sitemap.xml</h2>
                <button onclick="downloadFile('sitemap.xml', sitemapContent)">Download sitemap.xml</button>
            </div>
            <pre><code id="sitemapOutput"></code></pre>
        </div>
    </div>

    <script>
        let robotsContent = '';
        let sitemapContent = '';

        function generateFiles() {
            let domain = document.getElementById('domain').value.trim();
            if (domain.endsWith('/')) {
                domain = domain.slice(0, -1);
            }

            const rawPages = document.getElementById('pages').value.split(',');
            
            // Generate robots.txt
            robotsContent = `User-agent: *\nAllow: /\n\n# Cloudflare Pages asset optimization rule\nDisallow: /cdn-cgi/\n\nSitemap: ${domain}/sitemap.xml`;
            document.getElementById('robotsOutput').textContent = robotsContent;

            // Generate sitemap.xml
            const today = new Date().toISOString().split('T')[0];
            let urlElements = '';

            rawPages.forEach(page => {
                let cleanPage = page.trim();
                if (!cleanPage.startsWith('/')) {
                    cleanPage = '/' + cleanPage;
                }
                const loc = domain + (cleanPage === '/' ? '' : cleanPage);
                const priority = cleanPage === '/' ? '1.0' : '0.8';
                
                urlElements += `  <url>\n    <loc>${loc}</loc>\n    <lastmod>${today}</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>${priority}</priority>\n  </url>\n`;
            });

            sitemapContent = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urlElements}</urlset>`;
            document.getElementById('sitemapOutput').textContent = sitemapContent;
        }

        function downloadFile(filename, content) {
            const element = document.createElement('a');
            const file = new Blob([content], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        // Initial generation on load
        generateFiles();
    </script>
</body>

</html>
